<div class="main-wrapper">
    <modal-constructor
        [visible]="showModalConstructor"
        (optionSelectedEvent)="getOptionSelectedEvent($event)"
    ></modal-constructor>
    <div class="header-container"
        joyrideStep="modeStep" 
        [title]="promptSystemHelp['title']" 
        [text]="promptSystemHelp['text']"
        >
        <div class="header-top-row">
            <div class="title-header">
                <h2 class="title-text">
                    {{ titleData }}
                </h2>
                <chat-buttons
                    [eraseButton]="false"
                    [saveButton]="false"
                    [exportButton]="false"
                    [copyButton]="false"
                    [generateImageButton]="false"
                    [generatePromptButton]="false"
                    [guideButton]="true"
                    (submitGuideTextEmitter)="startTour()"
                ></chat-buttons>
            </div>
            <div class="segment-control">
                <button class="segment-btn"
                    [class.segment-active]="selectedOption === radioButton1"
                    (click)="selectedOption = radioButton1; onRadioChange(null)">
                    {{radioButton1}}
                </button>
                <button class="segment-btn"
                    [class.segment-active]="selectedOption === radioButton2"
                    (click)="selectedOption = radioButton2; onRadioChange(null)">
                    {{radioButton2}}
                </button>
            </div>
        </div>
        <horizontal-stepper
            [steps]="stepperConfig().steps"
            [activeStep]="stepperConfig().active">
        </horizontal-stepper>
    </div>
    <editor-template
        [editors]="editors"
        [hasBasicTemplate]="hasBasicTemplate"
        [hasSyntheticData]="hasSyntheticData"
        [hasPublicityData]="hasPublicityData"
        [modalHint]="modalHint"
        [hasEditorContent]="hasEditorContent"
        [textHelp]="textHelp"
        [titles]="titlesHelp"
        [processButtonTooltipHeader]="processButtonTooltipHeader"
        [promptUser]="promptUser"
        [generarButton]="generarButton"
        (submitGenerateImage)="generateImage($event)"
        (eraseTextEvent)="emitEraseText($event.event, $event.index)"
        (updatePromptEvent)="updatePromptFromContentEditable($event.event, $event.item)"
        (nodeSelectEvent)="nodeSelect($event.event, $event.item, $event.index)"
        (promptUserChange)="promptUser = $event">
    </editor-template>
</div>
