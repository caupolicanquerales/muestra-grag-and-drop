<div class="main-wrapper">
    <div class="header-container"
        joyrideStep="modeStep" 
        [title]="promptSystemHelp['title']" 
        [text]="promptSystemHelp['text']"
        >
        <div class="title-header">
            <h2 class="title-text">
                {{ titleData }}
            </h2>
            <chat-buttons
                [eraseButton]="false"
                [saveButton]="false"
                [exportButton]="false"
                [copyButton]="false"
                [generateImageButton]="false"
                [generatePromptButton]="false"
                [helpButton]="true"
                (submitHelpTextEmitter)="startTour()"
            ></chat-buttons>
        </div>
        <div class="segment-control">
            <button class="segment-btn"
                [class.segment-active]="selectedOption === radioButton1"
                (click)="selectedOption = radioButton1; onRadioChange(null)">
                {{radioButton1}}
            </button>
            <button class="segment-btn"
                [class.segment-active]="selectedOption === radioButton2"
                (click)="selectedOption = radioButton2; onRadioChange(null)">
                {{radioButton2}}
            </button>
        </div>
    </div>
    <div class="card-container" >
        @for (item of editors(); track item.id; let last = $last; let i = $index) { 
            <ng-container *ngTemplateOutlet="editorTemplate; context: {
                index: i, 
                id: item.id, 
                treeData: item.tree, 
                promptValue: item.styledPrompt ,
                item: item,
                titles: titlesHelp
            }"></ng-container>

            @if (!last) {
            <div class="editor-divider"></div>
            }
            @if (last) {
                <div class="command-center">
                    <textarea rows="3" pTextarea [(ngModel)]="promptUser" placeholder="{{placeHolderPromptUser}}" [disabled]="allowPromptUser" fluid></textarea>
                    <div class="command-actions">
                        <chat-buttons
                            [eraseButton]="false"
                            [saveButton]="false"
                            [exportButton]="false"
                            [copyButton]="false"
                            [generateImageButton]="true"
                            [generatePromptButton]="false"
                            (submitGenerateImage)="generateImage($event)"
                        ></chat-buttons>
                    </div>
                </div>
            }
        }
    </div>
</div>

<ng-template #editorTemplate 
  let-treeData="treeData" 
  let-selection="selection" 
  let-promptValue="promptValue" 
  let-id="id"
  let-item="item"
  let-index="index"
  let-titles="titles"
  >
  <div class="editor-content-wrapper">
    <div class="p-selector-group" 
        [joyrideStep]="'treeStep_' + item.id"
        [title]="titles[item.id+1]"
        [text]="textHelp[item.id+1]">
        
        <ng-container *ngTemplateOutlet="treeContent; context: { item: item, treeData: treeData }"></ng-container>
    </div>
    <div class="code-panel">
        <div class="code-toolbar">
            <span class="code-label">{{ item.typePrompt }}</span>
            <chat-buttons
                [eraseButton]="true"
                [saveButton]="false"
                [exportButton]="false"
                [copyButton]="false"
                [generateImageButton]="false"
                [generatePromptButton]="false"
                (submitEraseTextEmitter)="emitEraseText($event, index)"
            ></chat-buttons>
        </div>
        <div class="relative-container">
            <div
                #editorRef
                [id]="id"
                [innerHTML]="promptValue"
                (input)="updatePromptFromContentEditable($event, item)"
                contenteditable="true"
                placeholder="placeHolder"
                class="prompt-input"
                [ngClass]="{'input-focus-ring': isFocused()}"
                (blur)="isFocused.set(false)">
            </div>
        </div>
    </div>
  </div>
</ng-template>


<ng-template #treeContent let-item="item" let-treeData="treeData">
    <p-tree [value]="treeData" class="w-full md:w-[30rem]" 
        selectionMode="single"
        (onNodeSelect)="nodeSelect($event, item, item.id)">
        <ng-template let-node pTemplate="default">
            <span [style]="node.style" [class.p-disabled]="node.selectable === false">
                {{ node.label }}
            </span>
        </ng-template>
    </p-tree>
</ng-template>
