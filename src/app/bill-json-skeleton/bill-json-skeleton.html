<div class="main-wrapper">
    <div class="header-container">
        <div class="title-header">
            <h2 class="title-text">
                {{ titleData }}
            </h2>
        </div>
        <div class="card-container" >
            @for (item of editors(); track item.id; let last = $last; let i = $index) { 
                <ng-container *ngTemplateOutlet="editorTemplate; context: {
                    index: i, 
                    id: item.id, 
                    promptValue: item.styledPrompt ,
                    item: item
                }
                "></ng-container>
            }
        </div>
    </div>
</div>

<ng-template #editorTemplate 
  let-promptValue="promptValue" 
  let-id="id"
  let-item="item"
  let-index="index"
  >
  <div class="editor-content-wrapper">
    <div class="textare-button-group">
        <h2 class="title-text">
            {{ item.typePrompt }}
        </h2>
        <div class="relative-container">
            <div 
                #editorRef
                [id]="id" 
                [innerHTML]="promptValue"
                (input)="updatePromptFromContentEditable($event, item)" 
                contenteditable="true"
                placeholder="placeHolder"
                class="prompt-input"
                [ngClass]="{'input-focus-ring': isFocused()}"
                (blur)="isFocused.set(false)">
            </div>
        </div>
        <div class="button-editor">
            <chat-buttons
            [eraseButton]="false"
            [saveButton]="true"
            [exportButton]="false"
            [copyButton]="false"
            [generateImageButton]="false"
            [generatePromptButton]="false"
            (submitSavePromptEmitter)="emitSavePrompt($event, index)"
            ></chat-buttons>
        </div>
    </div>
  </div>
</ng-template>
