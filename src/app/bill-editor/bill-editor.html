<div class="main-wrapper">
    <div class="header-container">
        <div class="title-header">
            <h2 class="title-text">{{ titleData }}</h2>
        </div>
        <div class="segment-control">
            @for (option of optionsRadioButton; track option.id) {
                <button
                    class="segment-btn"
                    [class.segment-active]="selectedOption === option.label"
                    (click)="selectedOption = option.label; onRadioChange(null)">
                    {{ option.label }}
                </button>
            }
        </div>
    </div>

    <div class="card-container">
        <div class="editor-content-wrapper">
            <div class="p-selector-group">
                <p-tree [value]="tree" class="w-full md:w-[30rem]"
                    selectionMode="single"
                    [(selection)]="selectedNode"
                    (onNodeSelect)="nodeSelect($event)">
                    <ng-template let-node pTemplate="default">
                        <span [ngStyle]="node.style" [class.p-disabled]="node.selectable === false">
                            {{ node.label }}
                        </span>
                    </ng-template>
                </p-tree>
            </div>

            <div class="code-panel">
                <div class="code-toolbar">
                    <span class="code-label">{{ selectedOption }}</span>
                    <chat-buttons
                        [eraseButton]="true"
                        [saveButton]="false"
                        [exportButton]="false"
                        [copyButton]="false"
                        [generateImageButton]="false"
                        [generatePromptButton]="false"
                        (submitEraseTextEmitter)="emitEraseText($event)"
                    ></chat-buttons>
                </div>
                <div class="relative-container">
                    <div
                        id="prompt-editor"
                        #editorRef
                        [innerHTML]="styledPrompt"
                        (input)="updatePromptFromContentEditable($event)"
                        contenteditable="true"
                        maxlength="10000"
                        placeholder="placeHolder"
                        class="prompt-input"
                        [ngClass]="{'input-focus-ring': isFocused()}"
                        (blur)="isFocused.set(false)">
                    </div>
                </div>
            </div>
        </div>

        <div class="command-actions">
            <chat-buttons
                [itemsExportPrompt]="itemsExportPrompt"
                [itemsSavePrompt]="itemsSavePrompt"
                [headerDialog]="headerDialog"
                [eraseButton]="false"
                [generateImageButton]="generateImageButton"
                [generatePromptButton]="generatePromptButton"
                [arrayPromptAndData]="promptAndDataToValidate"
                (submitDownloadFileEmitter)="exportInformation($event)"
                (submitCopyTextEmitter)="submitCopyText($event)"
                (submitSavePromptEmitter)="emitSavePrompt($event)"
                (submitGenerateImage)="generateImage($event)"
                (submitGeneratePrompt)="generatePrompt($event)"
            ></chat-buttons>
        </div>
    </div>
</div>
