<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <!-- Background -->
  <rect width="400" height="120" fill="#060b14"/>
  <!-- Background grid -->
  <line x1="0" y1="30" x2="400" y2="30" stroke="#0c1a2e" stroke-width="1"/>
  <line x1="0" y1="60" x2="400" y2="60" stroke="#0c1a2e" stroke-width="1"/>
  <line x1="0" y1="90" x2="400" y2="90" stroke="#0c1a2e" stroke-width="1"/>
  <line x1="100" y1="0" x2="100" y2="120" stroke="#0c1a2e" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="120" stroke="#0c1a2e" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="120" stroke="#0c1a2e" stroke-width="1"/>
  <!-- Document container -->
  <rect x="45" y="6" width="310" height="108" rx="2" fill="#050916" stroke="#1d4ed8" stroke-width="1.5" opacity="0.9"/>
  <!-- Opening brace { -->
  <text x="53" y="42" font-size="32" fill="#06b6d4" font-family="monospace" opacity="0.85">{</text>
  <!-- Closing brace } -->
  <text x="334" y="110" font-size="32" fill="#06b6d4" font-family="monospace" opacity="0.85">}</text>
  <!-- Row 1: "facturaId": "F-0042" -->
  <rect x="74" y="11" width="62" height="9" rx="1" fill="#0f2a4a" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="77" y="19" font-size="6.5" fill="#60a5fa" font-family="monospace">"facturaId"</text>
  <text x="139" y="19" font-size="7" fill="#475569" font-family="monospace">:</text>
  <rect x="147" y="11" width="46" height="9" rx="1" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.5"/>
  <text x="150" y="19" font-size="6.5" fill="#a5b4fc" font-family="monospace">"F-0042"</text>
  <!-- Row 2: "cliente": "Empresa S.A." -->
  <rect x="74" y="23" width="52" height="9" rx="1" fill="#0f2a4a" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="77" y="31" font-size="6.5" fill="#60a5fa" font-family="monospace">"cliente"</text>
  <text x="129" y="31" font-size="7" fill="#475569" font-family="monospace">:</text>
  <rect x="137" y="23" width="82" height="9" rx="1" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.5"/>
  <text x="140" y="31" font-size="6.5" fill="#a5b4fc" font-family="monospace">"Empresa S.A."</text>
  <!-- Row 3: "fecha": "2026-05-20" -->
  <rect x="74" y="35" width="41" height="9" rx="1" fill="#0f2a4a" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="77" y="43" font-size="6.5" fill="#60a5fa" font-family="monospace">"fecha"</text>
  <text x="118" y="43" font-size="7" fill="#475569" font-family="monospace">:</text>
  <rect x="126" y="35" width="70" height="9" rx="1" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.5"/>
  <text x="129" y="43" font-size="6.5" fill="#a5b4fc" font-family="monospace">"2026-05-20"</text>
  <!-- Row 4: "items": [ -->
  <rect x="74" y="47" width="40" height="9" rx="1" fill="#0f2a4a" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="77" y="55" font-size="6.5" fill="#60a5fa" font-family="monospace">"items"</text>
  <text x="117" y="55" font-size="7" fill="#475569" font-family="monospace">: [</text>
  <!-- Array item 1 -->
  <rect x="84" y="58" width="215" height="9" rx="1" fill="#1e1b4b" opacity="0.9" stroke="#4f46e5" stroke-width="0.5"/>
  <text x="87" y="66" font-size="5.8" fill="#818cf8" font-family="monospace">{ "desc": "Servicio A",  "precio": 100.00 },</text>
  <!-- Array item 2 -->
  <rect x="84" y="69" width="205" height="9" rx="1" fill="#1e1b4b" opacity="0.9" stroke="#4f46e5" stroke-width="0.5"/>
  <text x="87" y="77" font-size="5.8" fill="#818cf8" font-family="monospace">{ "desc": "Servicio B",  "precio": 200.00 }</text>
  <!-- Close array bracket -->
  <text x="74" y="88" font-size="7" fill="#475569" font-family="monospace">],</text>
  <!-- Row 5: "total": 300 -->
  <rect x="74" y="91" width="37" height="9" rx="1" fill="#0f2a4a" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="77" y="99" font-size="6.5" fill="#60a5fa" font-family="monospace">"total"</text>
  <text x="114" y="99" font-size="7" fill="#475569" font-family="monospace">:</text>
  <rect x="122" y="91" width="28" height="9" rx="1" fill="#064e3b" stroke="#10b981" stroke-width="0.5"/>
  <text x="125" y="99" font-size="6.5" fill="#34d399" font-family="monospace">300</text>
  <!-- Cyan corner brackets (same as card-planilla) -->
  <line x1="45" y1="11" x2="60" y2="11" stroke="#06b6d4" stroke-width="2"/>
  <line x1="45" y1="11" x2="45" y2="26" stroke="#06b6d4" stroke-width="2"/>
  <line x1="355" y1="11" x2="340" y2="11" stroke="#06b6d4" stroke-width="2"/>
  <line x1="355" y1="11" x2="355" y2="26" stroke="#06b6d4" stroke-width="2"/>
  <line x1="45" y1="109" x2="60" y2="109" stroke="#06b6d4" stroke-width="2"/>
  <line x1="45" y1="109" x2="45" y2="94" stroke="#06b6d4" stroke-width="2"/>
  <line x1="355" y1="109" x2="340" y2="109" stroke="#06b6d4" stroke-width="2"/>
  <line x1="355" y1="109" x2="355" y2="94" stroke="#06b6d4" stroke-width="2"/>
</svg>
